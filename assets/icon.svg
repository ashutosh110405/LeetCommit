<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#14141C"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#B80A12"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#E50914" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#3D1217" stroke-width="2"/>
  
  <!-- LeetCode Bracket < in Crimson -->
  <path d="M 44 40 L 22 64 L 44 88" fill="none" stroke="url(#crimsonGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#crimsonGlow)"/>
  
  <!-- Stylized Letter 'A' in the Center -->
  <path d="M 50 86 L 68 38 L 86 86" fill="none" stroke="url(#letterGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M 57 70 L 79 70" fill="none" stroke="url(#crimsonGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Git Branching Line from A's apex to Git Commit node -->
  <path d="M 68 38 Q 92 34 102 52 L 102 68" fill="none" stroke="#E50914" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Git Commit Node in Crimson Red -->
  <circle cx="102" cy="74" r="10" fill="#E50914" filter="url(#crimsonGlow)"/>
  <circle cx="102" cy="74" r="4.5" fill="#FFFFFF"/>
</svg>
